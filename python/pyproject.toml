[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tilt-lang"
version = "0.1.0"
description = "Cliente Python da linguagem Tilt (chama funcoes e pipelines .tilt via tilt rpc)"
requires-python = ">=3.8"
license = { text = "MIT" }
readme = "README.md"
dependencies = []

[project.optional-dependencies]
spark = ["pyspark>=3.4"]

[tool.setuptools.packages.find]
include = ["tilt*"]

[tool.setuptools.package-data]
tilt = ["py.typed"]
