name: tilt
base: core24
adopt-info: tilt
summary: Linguagem de programação para dados e IA
description: |
  Tilt: compilador/runtime C++20 para engenharia de dados, ML/DL,
  LLMs/RAG, agentes e serviços HTTP. Sem dependências de link —
  SQLite, zlib, OpenSSL e libpq são carregadas em runtime via dlopen.
grade: stable
confinement: classic

apps:
  tilt:
    command: usr/bin/tilt
    environment:
      # Drivers opcionais podem ser fornecidos por um content snap sem
      # alterar o binario. O runtime tambem aceita esse caminho fora do Snap.
      TILT_DRIVER_PATH: $SNAP_COMMON/tilt/drivers
    plugs:
      - network
      - network-bind
      - home
      - database-drivers
      - gpu
      - hardware-observe

plugs:
  # Slot de um snap fornecedor com libpq, SQLite, DuckDB, MariaDB/MySQL ou
  # outros componentes nativos. O provider publica o mesmo content id.
  database-drivers:
    interface: content
    content: tilt-database-drivers-v1
    target: $SNAP_COMMON/tilt/drivers
  # O plug opengl fornece o ponto de extensao grafico; CUDA continua sendo
  # carregado sob demanda do driver do host quando houver hardware.
  gpu:
    interface: opengl

parts:
  tilt:
    plugin: cmake
    source: .
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DTILT_WERROR=ON
      - -DCMAKE_INSTALL_PREFIX=/usr
    build-snaps: [cmake]
    # adopt-info exige que a part publique a versao (da tag, ex.: v0.1.0-rc1).
    # GITHUB_REF_NAME nao chega dentro da instancia LXD: com fallback para
    # git describe e para 0.1.0.
    override-pull: |
      craftctl default
      ver="${GITHUB_REF_NAME:-}"
      ver="${ver#v}"
      if [ -z "$ver" ]; then
        ver="$(git describe --tags --exact-match 2>/dev/null | sed 's/^v//' || true)"
      fi
      craftctl set version="${ver:-0.1.0}"
