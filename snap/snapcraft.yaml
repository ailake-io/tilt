name: tilt
base: core24
adopt-info: tilt
summary: Linguagem de programação para dados e IA
description: |
  Tilt: compilador/runtime C++20 para engenharia de dados, ML/DL,
  LLMs/RAG, agentes e serviços HTTP. Sem dependências de link —
  SQLite, zlib, OpenSSL e libpq são carregadas em runtime via dlopen.
grade: stable
confinement: classic

apps:
  tilt:
    command: bin/tilt

parts:
  tilt:
    plugin: cmake
    source: .
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DTILT_WERROR=ON
    build-snaps: [cmake]
    # adopt-info exige que a part publique a versao (da tag, ex.: v0.1.0-rc1)
    override-pull: |
      craftctl default
      ver="${GITHUB_REF_NAME#v}"
      if [ -z "$ver" ] && command -v git >/dev/null 2>&1; then
        ver="$(git describe --tags --exact-match 2>/dev/null | sed 's/^v//')"
      fi
      craftctl set version="${ver:-0.1.0}"
