name: docker

on:
  push:
    branches:
      - develop
      - main
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - '.github/workflows/docker.yml'
      - 'CMakeLists.txt'
      - 'src/**'
      - 'stdlib/**'
      - 'exemplos/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: ubuntu
            dockerfile: Dockerfile
            suffix: ''
            latest_tag: latest
          - variant: alpine
            dockerfile: Dockerfile.alpine
            suffix: '-alpine'
            latest_tag: latest-alpine
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag,suffix=${{ matrix.suffix }}
            type=ref,event=branch,suffix=${{ matrix.suffix }}
            type=sha,format=short,suffix=${{ matrix.suffix }}
            type=raw,value=${{ matrix.latest_tag }},enable={{is_default_branch}}

      - name: setup buildx
        uses: docker/setup-buildx-action@v3

      - name: login no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build e publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TILT_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.2.0-beta.2' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: smoke test local da imagem
        run: |
          docker build --tag tilt:ci \
            --file "${{ matrix.dockerfile }}" \
            --build-arg TILT_VERSION=0.2.0-beta.2 .
          docker run --rm tilt:ci versao
          docker run --rm tilt:ci checar /usr/local/share/tilt/exemplos/soma.tilt
