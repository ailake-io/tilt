name: ci

on:
  workflow_dispatch: # Actions > ci > Run workflow (qualquer branch)

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: lint changed C/C++ files
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: tests/lint_test.sh "$BASE_SHA" "$HEAD_SHA"

  lint_cpp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install clang-tidy and cpplint
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy
          python3 -m pip install --user --disable-pip-version-check cpplint==2.0.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: configure compile database
        run: cmake -S . -B build/lint -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: lint changed C/C++ files
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: tests/lint_cpp_test.sh "$BASE_SHA" "$HEAD_SHA" build/lint

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: deps (macOS)
        if: runner.os == 'macOS'
        # libpq e openssl sao keg-only no homebrew: o dlopen resolve via
        # DYLD_LIBRARY_PATH no step de teste.
        run: brew install libpq openssl@3

      - name: configure (Release, -Werror)
        run: cmake --preset release -DTILT_WERROR=ON

      - name: build
        run: cmake --build --preset release

      - name: test
        run: ctest --preset release --output-on-failure
        env:
          DYLD_LIBRARY_PATH: /opt/homebrew/lib:/opt/homebrew/opt/libpq/lib:/usr/local/lib:/usr/local/opt/libpq/lib

      - name: smoke
        run: |
          ./build/release/bin/tilt versao
          ./build/release/bin/tilt checar exemplos/soma.tilt
          ./build/release/bin/tilt executar exemplos/resumo_vendas.tilt
          ./build/release/bin/tilt executar exemplos/etl_delta.tilt
          TILT_LLM=mock ./build/release/bin/tilt executar exemplos/agente.tilt
          TILT_LLM=mock ./build/release/bin/tilt executar exemplos/agente_multi_etapas.tilt

  # Port Windows (MSVC, windows-latest): o CTest registra uma suíte funcional
  # nativa em PowerShell; os testes shell de conectores ficam em Linux/macOS.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: configure (Release, MSVC, -Werror)
        run: cmake --preset release -DTILT_WERROR=ON

      - name: build
        run: cmake --build --preset release

      - name: smoke
        shell: pwsh
        run: |
          # MSVC gera em bin\Release (multi-config); achar o tilt.exe por glob.
          $exe = (Get-ChildItem -Recurse -Filter tilt.exe build/release | Select-Object -First 1).FullName
          if (-not $exe) { throw "tilt.exe nao encontrado em build/release" }
          & $exe versao
          & $exe checar exemplos/soma.tilt
          & $exe executar exemplos/resumo_vendas.tilt
          & $exe executar exemplos/etl_delta.tilt
          $env:TILT_LLM = "mock"
          & $exe executar exemplos/agente.tilt

      - name: functional tests (CTest + PowerShell)
        shell: pwsh
        env:
          TILT_FUZZ_SALVAR: ${{ github.workspace }}\fuzz_ultimo.tilt
        run: ctest --test-dir build/release -C Debug --output-on-failure

      - name: last fuzz input (only when the tests failed)
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path "$env:GITHUB_WORKSPACE\fuzz_ultimo.tilt") {
            $t = Get-Content -Raw "$env:GITHUB_WORKSPACE\fuzz_ultimo.tilt"
            "tamanho: $($t.Length) caracteres"
            $t.Substring(0, [Math]::Min(4000, $t.Length))
          }

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-ultimo-windows
          path: fuzz_ultimo.tilt
          if-no-files-found: ignore

  connectors:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: install connector servers and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ curl unzip postgresql postgresql-client mariadb-server mariadb-client libmariadb-dev
          mkdir -p "$RUNNER_TEMP/duckdb"
          curl -fsSL -o "$RUNNER_TEMP/duckdb/libduckdb.zip" \
            https://github.com/duckdb/duckdb/releases/download/v1.5.5/libduckdb-linux-amd64.zip
          unzip -q "$RUNNER_TEMP/duckdb/libduckdb.zip" -d "$RUNNER_TEMP/duckdb"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/duckdb:${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: configure (Release, -Werror)
        run: cmake --preset release -DTILT_WERROR=ON

      - name: build
        run: cmake --build --preset release

      - name: start MongoDB
        run: |
          docker run -d --name tilt-mongo-ci -p 127.0.0.1:27017:27017 mongo:7
          for i in $(seq 1 60); do
            docker exec tilt-mongo-ci mongosh --quiet --eval 'db.runCommand({ping:1}).ok' 2>/dev/null | grep -q 1 && break
            sleep 1
          done

      - name: start Redis
        run: |
          docker run -d --name tilt-redis-ci -p 127.0.0.1:6379:6379 redis:7-alpine
          for i in $(seq 1 30); do
            docker exec tilt-redis-ci redis-cli ping 2>/dev/null | grep -q PONG && break
            sleep 1
          done

      - name: connector integration tests
        env:
          TILT_MONGO_REAL_URL: mongodb://127.0.0.1:27017/tilt_real
          TILT_REDIS_REAL_URL: redis://127.0.0.1:6379/0
        run: ctest --test-dir build/release -R "^(pg|mysql|duckdb|clickhouse|mongo_real|redis_real)$" --output-on-failure

      - name: cleanup MongoDB and Redis
        if: always()
        run: docker rm -f tilt-mongo-ci tilt-redis-ci || true


  vector_connectors:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: install pgvector client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: configure (Release, -Werror)
        run: cmake --preset release -DTILT_WERROR=ON

      - name: build
        run: cmake --build --preset release

      - name: start real vector services
        run: |
          docker run -d --name tilt-qdrant-ci -p 6333:6333 qdrant/qdrant:v1.13.6
          docker run -d --name tilt-weaviate-ci -p 8080:8080 \
            -e AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true \
            -e PERSISTENCE_DATA_PATH=/var/lib/weaviate \
            -e DEFAULT_VECTORIZER_MODULE=none \
            -e ENABLE_MODULES= \
            -e CLUSTER_HOSTNAME=node1 \
            semitechnologies/weaviate:1.28.4
          docker run -d --name tilt-chroma-ci -p 8000:8000 \
            -e IS_PERSISTENT=FALSE \
            chromadb/chroma:0.5.23
          docker run -d --name tilt-pgvector-ci -p 5433:5432 \
            -e POSTGRES_PASSWORD=tilt \
            -e POSTGRES_DB=vdb \
            pgvector/pgvector:pg16

      - name: real vector connector tests
        env:
          TILT_VECTOR_WAIT_ATTEMPTS: 90
        run: ctest --test-dir build/release -R '^vector_real$' --output-on-failure

      - name: cleanup vector services
        if: always()
        run: docker rm -f tilt-qdrant-ci tilt-weaviate-ci tilt-chroma-ci tilt-pgvector-ci || true

  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: configure (Debug, ASan/UBSan)
        run: cmake --preset debug
      - name: build
        run: cmake --build --preset debug
      - name: test
        run: ctest --preset debug --output-on-failure --timeout 300

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: install gcovr
        run: python3 -m pip install --user --disable-pip-version-check gcovr==8.3

      - name: configure (Debug, gcov instrumentation)
        run: cmake -S . -B build/coverage -DCMAKE_BUILD_TYPE=Debug -DTILT_COVERAGE=ON -DTILT_STATIC_LIBSTDCXX=OFF

      - name: build
        run: cmake --build build/coverage --parallel

      - name: test (services that are not available skip themselves)
        run: ctest --test-dir build/coverage -j2 --timeout 600 -E "vector_real|spark|tensor_benchmark|^golden$|^par$|equipe_paralela"

      - name: golden tests
        run: ctest --test-dir build/coverage --timeout 900 -R "^golden$"

      - name: coverage report
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # gcov (threads) as vezes emite contagens de branch negativas (GCC bug 68080).
          gcovr -r . --object-directory build/coverage --filter 'src/' \
            --gcov-ignore-parse-errors negative_hits.warn_once_per_file \
            --print-summary --xml coverage.xml --html-details coverage.html
          {
            echo '### Cobertura de linhas (src/)'
            gcovr -r . --object-directory build/coverage --filter 'src/' \
              --gcov-ignore-parse-errors negative_hits.warn_once_per_file --print-summary | tail -3
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            coverage*.html

  arm64_codegen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: install ARM64 toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ gcc-aarch64-linux-gnu qemu-user

      - name: configure (Release, -Werror)
        run: cmake --preset release -DTILT_WERROR=ON

      - name: build host compiler
        run: cmake --build --preset release

      - name: execute ARM64 codegen under QEMU
        run: ctest --test-dir build/release -R '^native_arm64$' --output-on-failure
