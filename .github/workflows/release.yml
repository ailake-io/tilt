name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-x86_64
          - os: macos-latest
            asset: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: configure
        run: cmake --preset release

      - name: build
        run: cmake --build --preset release

      - name: test
        run: ctest --preset release --output-on-failure

      # o gerador RPM do CPack precisa do rpmbuild (nao vem no runner ubuntu).
      - name: deps de empacotamento (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: package
        working-directory: build/release
        run: cpack

      - name: checksum
        run: |
          for f in build/release/tilt-*; do
            case "$f" in
              *.sha256) continue ;;
            esac
            (cd build/release && sha256sum "$(basename "$f")" > "$(basename "$f").sha256") || \
              (cd build/release && shasum -a 256 "$(basename "$f")" > "$(basename "$f").sha256")
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/release/tilt-*.tar.gz
            build/release/tilt-*.tar.gz.sha256
            build/release/tilt-*.deb
            build/release/tilt-*.deb.sha256
            build/release/tilt-*.rpm
            build/release/tilt-*.rpm.sha256
            build/release/tilt-*.dmg
            build/release/tilt-*.dmg.sha256
          generate_release_notes: true

  # --- Windows (.msi via WIX + .zip): build MSVC, smoke, empacota com
  # cpack. O WiX Toolset ja vem no runner windows-latest (candle/light).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: configure
        run: cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release

      - name: build
        run: cmake --build build/release --config Release

      - name: smoke
        run: |
          $exe = (Get-ChildItem -Recurse -Filter tilt.exe build/release | Select-Object -First 1).FullName
          if (-not $exe) { throw "tilt.exe nao encontrado em build/release" }
          & $exe versao
          & $exe checar exemplos/soma.tilt
          & $exe executar exemplos/resumo_vendas.tilt

      - name: package
        working-directory: build/release
        run: cpack -C Release

      - name: checksum
        working-directory: build/release
        shell: bash
        run: |
          for f in tilt-*.msi tilt-*.zip; do
            [ -e "$f" ] || continue
            sha256sum "$f" > "$f.sha256"
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/release/tilt-*.msi
            build/release/tilt-*.msi.sha256
            build/release/tilt-*.zip
            build/release/tilt-*.zip.sha256
          generate_release_notes: true

  # --- Snap (classic): build via snapcore/action-build (roda snapcraft com
  # LXD no runner). Publicacao na Snap Store exige SNAPCRAFT_TOKEN.
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: snapcore/action-build@v1
        id: snapcraft

      - name: SNAPCRAFT_TOKEN configurado?
        id: token
        env:
          SNAPCRAFT_TOKEN: ${{ secrets.SNAPCRAFT_TOKEN }}
        run: |
          if [ -n "$SNAPCRAFT_TOKEN" ]; then echo "set=true" >> "$GITHUB_OUTPUT";
          else echo "set=false" >> "$GITHUB_OUTPUT"; fi

      - name: publicar na Snap Store
        if: steps.token.outputs.set == 'true'
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_TOKEN: ${{ secrets.SNAPCRAFT_TOKEN }}
        with:
          snap: ${{ steps.snapcraft.outputs.snap }}
          release: stable

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.snapcraft.outputs.snap }}

  # --- Flatpak: valida o manifesto e o metainfo com flatpak-builder
  # (empacotamento local: flatpak-builder --repo=repo packaging/flatpak/...).
  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: instalar flatpak + flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: validar manifesto
        run: flatpak-builder --force-clean build-flatpak packaging/flatpak/io.github.ailake_io.tilt.json

      - name: validar metainfo
        run: |
          appstreamcli validate --no-net packaging/flatpak/io.github.ailake_io.tilt.metainfo.xml \
            || true   # metainfo ainda nao publicado; warn de <release> e ok

      # empacota um .flatpak instalavel para anexar à Release
      - name: gerar bundle .flatpak
        run: |
          flatpak-builder --repo=repo build-flatpak packaging/flatpak/io.github.ailake_io.tilt.json
          ver="${GITHUB_REF_NAME#v}"
          flatpak build-bundle repo "tilt-${ver}.flatpak" io.github.ailake_io.tilt

      - name: checksum do bundle
        run: sha256sum "tilt-${GITHUB_REF_NAME#v}.flatpak" > "tilt-${GITHUB_REF_NAME#v}.flatpak.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            tilt-*.flatpak
            tilt-*.flatpak.sha256

  # --- Homebrew: valida a sintaxe da formula (brew test precisa de tap).
  homebrew:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: ruby -c na formula
        run: ruby -c packaging/homebrew/tilt.rb

  # Empacota a extensão VS Code e publica no Marketplace quando o secret
  # VSCE_PAT está configurado (sem o secret, só anexa o .vsix ao release).
  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install + package
        working-directory: editors/vscode
        run: |
          npm ci
          npm run package

      # secrets nao sao acessiveis em 'if:'; exporta-se um flag via output.
      - name: VSCE_PAT configurado?
        id: pat
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then echo "set=true" >> "$GITHUB_OUTPUT";
          else echo "set=false" >> "$GITHUB_OUTPUT"; fi

      - name: publish to Marketplace
        if: steps.pat.outputs.set == 'true'
        working-directory: editors/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish -p "$VSCE_PAT"

      - uses: softprops/action-gh-release@v2
        with:
          files: editors/vscode/*.vsix

  # --- winget: atualiza o manifesto ailake-io.tilt no microsoft/winget-pkgs.
  # Com WINGET_TOKEN (fork do winget-pkgs + escopo public_repo) o PR é aberto
  # automaticamente via wingetcreate; sem o secret, o job gera o manifesto
  # atualizado (versao/URL/SHA256 do .msi da release) e anexa ao release para
  # submissao manual com 'wingetcreate submit'.
  winget:
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8

      - name: computa versao e url do .msi
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ver="${TAG#v}"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "msi_url=https://github.com/ailake-io/tilt/releases/download/${TAG}/tilt-${ver}-win64.msi" >> "$GITHUB_OUTPUT"

      - name: baixa o .msi e calcula SHA256
        run: |
          curl -fSL -o tilt.msi "${{ steps.meta.outputs.msi_url }}"
          sha256sum tilt.msi | cut -d' ' -f1 > tilt.msi.sha256
          echo "sha256=$(cat tilt.msi.sha256)" >> "$GITHUB_OUTPUT"

      - name: manifesto atualizado (artifact de fallback)
        id: manifesto
        run: |
          tmp=$(mktemp -d)
          cp packaging/winget/ailake-io.tilt.yaml "$tmp/"
          sed -i "s/^PackageVersion: .*/PackageVersion: ${{ steps.meta.outputs.ver }}/" \
            "$tmp/ailake-io.tilt.yaml"
          sed -i "s|^\( *\)InstallerUrl: .*|\1InstallerUrl: ${{ steps.meta.outputs.msi_url }}|" \
            "$tmp/ailake-io.tilt.yaml"
          sed -i "s/^\( *\)InstallerSha256: .*/\1InstallerSha256: ${{ steps.meta.outputs.sha256 }}/" \
            "$tmp/ailake-io.tilt.yaml"
          echo "dir=$tmp" >> "$GITHUB_OUTPUT"

      # secrets nao sao acessiveis em 'if:'; exporta-se um flag via output.
      - name: WINGET_TOKEN configurado?
        id: tok
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -n "$WINGET_TOKEN" ]; then echo "set=true" >> "$GITHUB_OUTPUT";
          else echo "set=false" >> "$GITHUB_OUTPUT"; fi

      - name: instalar wingetcreate
        run: dotnet tool install --global wingetcreate

      - name: submeter PR ao winget-pkgs
        if: steps.tok.outputs.set == 'true'
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          "$HOME/.dotnet/tools/wingetcreate" update ailake-io.tilt \
            --version "${{ steps.meta.outputs.ver }}" \
            --urls "${{ steps.meta.outputs.msi_url }}" \
            --submit --token "$WINGET_TOKEN"

      - uses: softprops/action-gh-release@v2
        if: steps.tok.outputs.set == 'false'
        with:
          files: ${{ steps.manifesto.outputs.dir }}/ailake-io.tilt*.yaml
