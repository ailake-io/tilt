name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-x86_64
          - os: macos-latest
            asset: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: configure
        run: cmake --preset release

      - name: build
        run: cmake --build --preset release

      - name: test
        run: ctest --preset release --output-on-failure

      - name: package
        working-directory: build/release
        run: cpack

      - name: checksum
        run: |
          for f in build/release/tilt-*; do
            case "$f" in
              *.sha256) continue ;;
            esac
            (cd build/release && sha256sum "$(basename "$f")" > "$(basename "$f").sha256") || \
              (cd build/release && shasum -a 256 "$(basename "$f")" > "$(basename "$f").sha256")
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/release/tilt-*.tar.gz
            build/release/tilt-*.tar.gz.sha256
            build/release/tilt-*.deb
            build/release/tilt-*.deb.sha256
            build/release/tilt-*.rpm
            build/release/tilt-*.rpm.sha256
            build/release/tilt-*.dmg
            build/release/tilt-*.dmg.sha256
          generate_release_notes: true

  # --- Windows (.msi via WIX + .zip): build MSVC, smoke, empacota com
  # cpack. O WiX Toolset ja vem no runner windows-latest (candle/light).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: configure
        run: cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release

      - name: build
        run: cmake --build build/release --config Release

      - name: smoke
        run: |
          $exe = (Get-ChildItem -Recurse -Filter tilt.exe build/release | Select-Object -First 1).FullName
          if (-not $exe) { throw "tilt.exe nao encontrado em build/release" }
          & $exe versao
          & $exe checar exemplos/soma.tilt
          & $exe executar exemplos/resumo_vendas.tilt

      - name: package
        working-directory: build/release
        run: cpack -C Release

      - name: checksum
        working-directory: build/release
        shell: bash
        run: |
          for f in tilt-*.msi tilt-*.zip; do
            [ -e "$f" ] || continue
            sha256sum "$f" > "$f.sha256"
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/release/tilt-*.msi
            build/release/tilt-*.msi.sha256
            build/release/tilt-*.zip
            build/release/tilt-*.zip.sha256
          generate_release_notes: true

  # --- Snap (classic): build via snapcore/action-build (roda snapcraft com
  # LXD no runner). Publicacao na Snap Store exige SNAPCRAFT_TOKEN.
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: snapcore/action-build@v1
        id: snapcraft

      - name: SNAPCRAFT_TOKEN configurado?
        id: token
        env:
          SNAPCRAFT_TOKEN: ${{ secrets.SNAPCRAFT_TOKEN }}
        run: |
          if [ -n "$SNAPCRAFT_TOKEN" ]; then echo "set=true" >> "$GITHUB_OUTPUT";
          else echo "set=false" >> "$GITHUB_OUTPUT"; fi

      - name: publicar na Snap Store
        if: steps.token.outputs.set == 'true'
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_TOKEN: ${{ secrets.SNAPCRAFT_TOKEN }}
        with:
          snap: ${{ steps.snapcraft.outputs.snap }}
          release: stable

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.snapcraft.outputs.snap }}

  # --- Flatpak: valida o manifesto e o metainfo com flatpak-builder
  # (empacotamento local: flatpak-builder --repo=repo packaging/flatpak/...).
  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: instalar flatpak + flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: validar manifesto
        run: flatpak-builder --force-clean build-flatpak packaging/flatpak/io.github.ailake_io.tilt.json

      - name: validar metainfo
        run: |
          appstreamcli validate --no-net packaging/flatpak/io.github.ailake_io.tilt.metainfo.xml \
            || true   # metainfo ainda nao publicado; warn de <release> e ok

  # --- Homebrew: valida a sintaxe da formula (brew test precisa de tap).
  homebrew:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: ruby -c na formula
        run: ruby -c packaging/homebrew/tilt.rb

  # Empacota a extensão VS Code e publica no Marketplace quando o secret
  # VSCE_PAT está configurado (sem o secret, só anexa o .vsix ao release).
  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install + package
        working-directory: editors/vscode
        run: |
          npm ci
          npm run package

      # secrets nao sao acessiveis em 'if:'; exporta-se um flag via output.
      - name: VSCE_PAT configurado?
        id: pat
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then echo "set=true" >> "$GITHUB_OUTPUT";
          else echo "set=false" >> "$GITHUB_OUTPUT"; fi

      - name: publish to Marketplace
        if: steps.pat.outputs.set == 'true'
        working-directory: editors/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish -p "$VSCE_PAT"

      - uses: softprops/action-gh-release@v2
        with:
          files: editors/vscode/*.vsix
